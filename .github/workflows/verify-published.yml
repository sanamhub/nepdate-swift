name: verify-published

# Builds a released tag from its GitHub URL in a fresh SwiftPM package, the way a user adds it, and
# checks that the two Examples programs print the same as when built from the tagged checkout.
# release.yml calls it after the GitHub Release exists (a release made with GITHUB_TOKEN fires no
# release event, so a trigger would never run). It can also be run by hand for any released tag.
#
# Scheduled runs keep the published package honest after the release page goes quiet. Every Monday
# one Linux runner installs the newest release from the Releases API and checks one date conversion
# and the New Year event; every day a metadata-only run confirms that the tag is still released and
# that its tarball answers a HEAD request without downloading it. A failure opens or updates one
# issue labelled published-check. The check jobs read the repository and the Releases API; only the
# report job writes.

on:
  workflow_call:
    inputs:
      version:
        description: released tag, for example 0.1.0-beta.1, or latest for the newest release
        required: false
        default: latest
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: released tag, for example 0.1.0-beta.1, or latest for the newest release
        required: false
        default: latest
        type: string
  schedule:
    # The weekly install check, Monday 08:13 UTC.
    - cron: "13 8 * * 1"
    # The daily metadata check, which fetches no package file.
    - cron: "47 3 * * *"

permissions:
  contents: read

jobs:
  # One place resolves latest, so every job of a run checks the same version.
  resolve:
    name: resolve the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The releases API allows 60 unauthenticated requests an hour per address, and a runner's
      # address is shared; the token keeps a busy address from failing the resolve.
      - name: Resolve
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-latest}"
          if [ "$version" = latest ]; then
            version="$(bash scripts/verify-published.sh latest --resolve)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  # A release or a manual run: the same check on every runner OS. The jobs stay separate because
  # each installs its own Swift toolchain, and the Linux one runs inside the swift image.
  macos:
    name: verify ${{ needs.resolve.outputs.version }} (macOS)
    if: github.event_name != 'schedule'
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.version }}
          persist-credentials: false
      # The script comes from the ref this workflow runs on, so a fixed script can re-verify a tag
      # that was released with an older one: dispatch it from main with that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .verify-tool
          persist-credentials: false
      - name: Published package against the tagged checkout
        id: check
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -o pipefail
          bash .verify-tool/scripts/verify-published.sh "$VERSION" 2>&1 | tee verify.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (macOS)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 verify.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-verify-macos
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: verify ${{ needs.resolve.outputs.version }} (Linux)
    if: github.event_name != 'schedule'
    needs: resolve
    runs-on: ubuntu-24.04
    container: swift:6.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.version }}
          persist-credentials: false
      # The script comes from the ref this workflow runs on, so a fixed script can re-verify a tag
      # that was released with an older one: dispatch it from main with that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .verify-tool
          persist-credentials: false
      - name: Published package against the tagged checkout
        id: check
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -o pipefail
          bash .verify-tool/scripts/verify-published.sh "$VERSION" 2>&1 | tee verify.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (Linux)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 verify.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-verify-linux
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: verify ${{ needs.resolve.outputs.version }} (Windows)
    if: github.event_name != 'schedule'
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.version }}
          persist-credentials: false
      # The script comes from the ref this workflow runs on, so a fixed script can re-verify a tag
      # that was released with an older one: dispatch it from main with that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .verify-tool
          persist-credentials: false
      - name: Published package against the tagged checkout
        id: check
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -o pipefail
          bash .verify-tool/scripts/verify-published.sh "$VERSION" 2>&1 | tee verify.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (Windows)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 verify.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-verify-windows
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  # The weekly check: Linux only, one manager, and the newest release. There is no checkout of the
  # tag here, so the script builds the published package alone and compares fixed output.
  weekly:
    name: weekly ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule' && github.event.schedule == '13 8 * * 1'
    needs: resolve
    runs-on: ubuntu-24.04
    container: swift:6.4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [swiftpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and run the published package
        id: check
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          MANAGER: ${{ matrix.manager }}
        run: |
          set -o pipefail
          bash scripts/verify-published.sh "$VERSION" --standalone --manager "$MANAGER" 2>&1 | tee verify.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          MANAGER: ${{ matrix.manager }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (weekly, $MANAGER)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 verify.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-weekly-${{ matrix.manager }}
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  # The daily check: the Releases API still lists the tag and its tarball still answers, with no
  # download, so it cannot look like install traffic.
  metadata:
    name: metadata ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule' && github.event.schedule == '47 3 * * *'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release listing
        id: check
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash scripts/verify-published.sh "$VERSION" --metadata 2>&1 | tee metadata.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (metadata)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 metadata.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-metadata
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  # The only job with write access. It reads the artifacts the check jobs kept and opens or updates
  # one issue; it never installs anything.
  report:
    name: report
    if: failure() && github.event_name == 'schedule'
    needs: [resolve, macos, linux, windows, weekly, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failure-*
          path: failures
      - name: Open or update the issue
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/published-issue.sh nepdate-swift "${VERSION:-latest}" failures
