name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same jobs on a tag, so a tag cannot release without the gates.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The hub's reusable shared-check job is added once sanamhub/nepdate is on GitHub.

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: ./scripts/ci.sh
      - name: DocC builds without warnings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild docbuild \
            -scheme NepDate \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/docc 2>&1 | tee docbuild.log
          if grep -n 'warning:' docbuild.log; then
            echo "DocC emitted a warning"
            exit 1
          fi
          echo "DocC: no warnings"
          grep -oE '/[^ ]+\.doccarchive' docbuild.log | tail -n 1 || true
      - name: Size gate (ADR-0006)
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --package-path Examples
          bin="$(swift build -c release --package-path Examples --show-bin-path)"
          for name in baseline core-only with-patro; do strip "$bin/$name"; done
          python3 Benchmarks/scripts/size-gate.py \
            --targets Benchmarks/size-targets.json \
            --baseline "$bin/baseline" \
            --core-only "$bin/core-only" \
            --with-patro "$bin/with-patro"

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: ./scripts/ci.sh
      - name: codegen is deterministic and --check fails on drift
        shell: bash
        run: |
          set -euo pipefail
          file=Sources/NepDate/Calendar.generated.swift
          swift run --package-path Tools/Codegen codegen
          first=$(sha256sum "$file")
          swift run --package-path Tools/Codegen codegen
          [ "$(sha256sum "$file")" = "$first" ] || { echo "two runs differ"; exit 1; }
          printf ' ' >> "$file"
          if swift run --package-path Tools/Codegen codegen --check; then
            echo "--check passed after a one-byte change"; exit 1
          fi
          swift run --package-path Tools/Codegen codegen
      - name: ci.sh fails on an unformatted file
        shell: bash
        run: |
          set -uo pipefail
          printf 'enum Unformatted {\n\n\n  static let x = 1\n}\n' > Sources/NepDate/Unformatted.swift
          if ./scripts/ci.sh > ci.log 2>&1; then
            cat ci.log; echo "ci.sh passed an unformatted file"; exit 1
          fi
          cat ci.log
          [ "$(tail -n 1 ci.log)" = "ci: failed at gate 1: format" ]
          rm Sources/NepDate/Unformatted.swift ci.log
      - name: readme-check fails on a one-character change
        shell: bash
        run: |
          set -euo pipefail
          cp README.md "$RUNNER_TEMP/README.md.orig"
          trap 'cp "$RUNNER_TEMP/README.md.orig" README.md' EXIT
          perl -0pi -e 's/year: 2081, month: 4, day: 15/year: 2082, month: 4, day: 15/' README.md
          if swift run --package-path Tools/Codegen readme-check > readme.log 2>&1; then
            cat readme.log; echo "readme-check accepted a changed quick start"; exit 1
          fi
          cat readme.log
          grep -q "differs from Examples/Sources/core-only/main.swift" readme.log
      - name: release-check accepts and rejects the right versions
        run: bash scripts/test-release-check.sh
      - name: The pushed commit builds from its GitHub URL (verify-published --revision)
        # The same consumer verify-published.yml builds from a tag, pinned to this commit. A pull
        # request from a fork has no commit in this repository to fetch, so it skips the step.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/verify-published.sh --revision "$REVISION"
      - name: docs-check fails on an em dash and a broken link
        shell: bash
        run: |
          set -euo pipefail
          cp README.md "$RUNNER_TEMP/README.md.orig"
          trap 'cp "$RUNNER_TEMP/README.md.orig" README.md' EXIT
          printf '\nAn em dash — here.\n' >> README.md
          if swift run --package-path Tools/Codegen docs-check > docs.log 2>&1; then
            cat docs.log; echo "docs-check accepted an em dash"; exit 1
          fi
          grep -q "em dash" docs.log
          cp "$RUNNER_TEMP/README.md.orig" README.md
          perl -0pi -e 's{\(docs/API\.md\)}{(docs/does-not-exist.md)}' README.md
          if swift run --package-path Tools/Codegen docs-check > docs.log 2>&1; then
            cat docs.log; echo "docs-check accepted a broken link"; exit 1
          fi
          grep -q "does not resolve" docs.log
          cp "$RUNNER_TEMP/README.md.orig" README.md

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: ./scripts/ci.ps1
        shell: pwsh
      - name: The pushed commit builds from its GitHub URL (verify-published --revision)
        # Windows runs the consumer through Git Bash and swift.exe, which is where 0.1.0-beta.1's
        # verify-published first failed (swift run could not start the built program), so it is
        # checked here before any tag.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify-published.sh --revision "$REVISION"
      - name: ci.ps1 fails on an unformatted file
        shell: pwsh
        run: |
          Set-Content -NoNewline -Path Sources/NepDate/Unformatted.swift `
            -Value "enum Unformatted {`n`n`n  static let x = 1`n}`n"
          $out = pwsh -NoProfile -File scripts/ci.ps1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -eq 0) { throw 'ci.ps1 passed an unformatted file' }
          if ($out[-1] -ne 'ci: failed at gate 1: format') { throw "last line was: $($out[-1])" }
          Remove-Item Sources/NepDate/Unformatted.swift
          exit 0

  bench:
    runs-on: ubuntu-24.04
    container: swift:6.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Times are printed for the record; only the malloc thresholds are gated (ADR-0004).
      - name: Benchmarks (CI runner, not the reference machine)
        run: swift package --package-path Benchmarks benchmark --no-progress --target NepDateBenchmarks
      - name: Malloc thresholds
        run: >
          swift package --package-path Benchmarks benchmark thresholds check
          --no-progress --path "$GITHUB_WORKSPACE/Benchmarks/Thresholds"
      - name: First access
        run: swift run -c release --package-path Benchmarks first-access
      - name: swift_once in the table accessors
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --target NepDate
          # The build system's object layout differs between SwiftPM versions, so search by name.
          objects=$(find .build -name '*.o' | grep -iv debug | grep -E '(Calendar\.generated|NepaliDate)[^/]*\.o$')
          echo "objects: $objects"
          for obj in $objects; do
            echo "== $obj: CalendarData symbols"
            nm "$obj" | grep CalendarData || true
            echo "== $obj: calls to swift_once or swift_initStaticObject, by function"
            objdump -dr --no-show-raw-insn "$obj" | awk '
              /^[0-9a-f]+ <.*>:$/ { name = $2; next }
              /swift_once|swift_initStaticObject/ { print name, $NF }' | sort | uniq -c
          done

  fuzz:
    runs-on: ubuntu-24.04
    container: swift:6.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the fuzz targets
        run: >
          swift build -c debug --package-path Fuzz -Xswiftc -sanitize=fuzzer,address
          -Xswiftc -parse-as-library -Xswiftc -enable-testing
      # Seed corpus: the input column of parse.tsv, one file per row.
      - name: Fuzz parse, parseLenient, canonical parse and format for 60 seconds each
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          mkdir -p corpus
          n=0
          tail -n +2 shared/spec/vectors/parse.tsv | cut -f1 | while IFS= read -r line; do
            n=$((n + 1))
            printf '%s' "$line" > "corpus/row$n"
          done
          # Two canonical shapes the fast path must handle: an invalid date and a non-digit.
          printf '9999/99/99' > corpus/canonical-invalid
          printf '2081/0:/15' > corpus/canonical-nondigit
          bin=$(swift build -c debug --package-path Fuzz --show-bin-path)
          for target in FuzzParse FuzzParseLenient FuzzFormat FuzzParseCanonical; do
            mkdir -p "work/$target"
            cp corpus/* "work/$target/"
            "$bin/$target" -max_total_time=60 "work/$target"
          done
