name: release

# ADR-0005 and docs/runbooks/release.md. A tag push validates the version, runs the CI jobs and,
# after the `production` approval, creates the GitHub Release, then verify-published.yml builds the
# tag from its URL on every OS. A workflow_dispatch run is the dry run: it validates the same things
# and runs the same CI jobs, and the release job's condition keeps it from creating anything.
on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate in the dry run, X.Y.Z or X.Y.Z-PRERELEASE
        required: true
        type: string

# Rule: the workflow reads by default. Only the release job writes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the version and the changelog section
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          else
            version="$REF_NAME"
          fi
          bash scripts/release-check.sh "$version"
          case "$version" in *-*) kind="pre-release" ;; *) kind="release" ;; esac
          {
            echo "### preflight: $version"
            echo ""
            echo "- version: semver without v, $kind"
            echo "- changelog: \`## [$version] - <date>\` present"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: [preflight, ci]
    # A dispatch dry run, even one made from a tag ref, never releases (rule 3).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release from the changelog
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Re-check in the job that writes, so a tampered preflight output cannot pass.
          bash scripts/release-check.sh "$VERSION"
          notes="$(mktemp)"
          # index() matches the heading literally, so the dots in the version are not wildcards.
          awk -v v="$VERSION" '
            index($0, "## [" v "] - ") == 1 { inside = 1; next }
            /^## \[/ && inside { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::the changelog section for $VERSION is empty"
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo '```swift'
            echo ".package(url: \"https://github.com/sanamhub/nepdate-swift\", exact: \"$VERSION\")"
            echo '```'
            echo
            echo "Then depend on \`NepDate\`, and on \`NepDatePatro\` for tithi, holidays and events."
            echo
            echo "### Verification"
            echo
            echo "- SwiftPM builds this tag from source; there is no binary artifact to check."
            echo "- After this release, a fresh package depending on this exact tag built and ran the two"
            echo "  Examples programs on macOS, Linux and Windows, with the same output as the tagged"
            echo "  checkout (verify-published)."
          } >> "$notes"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$VERSION" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$notes" \
            "${prerelease[@]}"

  verify-published:
    name: verify-published
    needs: [preflight, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
